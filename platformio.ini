; PlatformIO-Konfiguration der Bodenstation (Arduino Nano, ATmega328P)
;
;   pio run                   baut den HC-12-Empfänger (src/)
;   pio run -t upload         flasht ihn (alter Bootloader: 57600 Bd)
;   pio device monitor        serielle Konsole, 9600 Bd
;   pio run -e fan_esc        baut einen Test-Sketch aus examples/

[platformio]
default_envs = nanoatmega328

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 57600
monitor_speed = 9600

; ----- Bodenstation: HC-12-Empfänger -----
[env:nanoatmega328]

; ----- Test-Sketches (je ein main.cpp unter examples/<name>/) -----
[env:mpu6050_gyro]
build_src_filter = -<*> +<../examples/mpu6050_gyro/>
lib_deps = pkourany/MPU6050@^1.0.3

[env:camera_trigger]
build_src_filter = -<*> +<../examples/camera_trigger/>

[env:fan_esc]
build_src_filter = -<*> +<../examples/fan_esc/>
lib_deps = Servo
